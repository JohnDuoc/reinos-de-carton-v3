<!DOCTYPE html>

<html lang="es">
<head>

    <meta charset="UTF-8">
    <title>Recuperar Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
        <h3 class="text-center mb-4">Restablecer Contraseña</h3>
        
        <form id="form-recuperar">
            <div class="mb-3">
                <label for="correo-recuperar" class="form-label">Correo registrado</label>
                <input type="email" id="correo-recuperar" class="form-control" required placeholder="Ej: correo@ejemplo.com">
            </div>
            <div class="mb-3">
                <label for="nueva-password" class="form-label">Nueva contraseña</label>
                <input type="password" id="nueva-password" class="form-control" required>
            </div>

            <div class="mb-4">
                <label for="confirmar-password" class="form-label">Confirmar nueva contraseña</label>
                <input type="password" id="confirmar-password" class="form-control" required placeholder="Repite la contraseña">
            </div>
            
            <button type="submit" class="btn btn-warning w-100">Cambiar Contraseña</button>
            
            <div class="mt-3 text-center">
                <a href="login.html">Volver al Login</a>
            </div>
        </form>
    </div>

    <script src="js/recuperar.js"></script>
</body>
</html>
