<!DOCTYPE html>

<html lang="es">

<head>
    <!-- Codificación del documento -->
    <meta charset="UTF-8" />

    <!-- Ayuda a que la página se visualice correctamente en distintos dispositivos -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi cuenta</title>

    <!-- Bootstrap para estilos rápidos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">


</head>

<body class="bg-light">

    <div class="container">
        <h3>Mi cuenta</h3>

        <!--
      Este párrafo se completará desde js/sesion.js.
      Mostrará un mensaje como:
      "Bienvenido, camila"
    -->
        <p id="mensaje"></p>

    </div>

    <!-- Script que controla acceso, bienvenida y cierre de sesión -->
    <script src="js/sesion.js"></script>



    <div class="container mt-5">
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Mi Perfil</h4>
                    </div>
                    <div class="card-body">
                        <p><strong>Nombre:</strong> <span id="perfil-nombre">Cargando...</span></p>
                        <p><strong>Usuario:</strong> <span id="perfil-usuario">Cargando...</span></p>
                        <p><strong>Correo:</strong> <span id="perfil-correo">Cargando...</span></p>
                        <p><strong>Dirección:</strong> <span id="perfil-direccion">Cargando...</span></p>
                        <p><strong>Miembro desde:</strong> <br><span id="perfil-fecha">Cargando...</span></p>

                        <button id="cerrar" class="btn btn-danger w-100 mt-3">Cerrar Sesión</button>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0">Mis Compras</h4>
                    </div>
                    <div class="card-body">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>Fecha</th>
                                    <th>Producto</th>
                                    <th>Estado</th>
                                    <th>Total</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-compras">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Script que controla acceso, bienvenida y cierre de sesión -->
    <script src="js/sesion.js"></script>

</body>

</html>
